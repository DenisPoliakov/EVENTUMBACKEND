        responses:
          '200':
            description: Бронирование обновлено
            content:
              application/json:
                schema: { $ref: '#/components/schemas/TrainingBooking' }
          '404':
            description: Бронирование не найдено

    /api/me/push-tokens:
      post:
        tags: [Ecosystem]
        summary: Идемпотентно зарегистрировать или обновить push-токен
        security: [{ bearerAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushTokenWrite' }
        responses:
          '200':
            description: Токен зарегистрирован или обновлён
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    pushToken: { $ref: '#/components/schemas/PushToken' }
          '400': { description: Неверный token, platform или metadata }
          '401': { description: Требуется Bearer-токен }
      delete:
        tags: [Ecosystem]
        summary: Удалить push-токен по значению
        security: [{ bearerAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        responses:
          '204': { description: Токен удалён или уже отсутствовал }
          '400': { description: token обязателен }
          '401': { description: Требуется Bearer-токен }

    /api/me/push-tokens/{id}:
      delete:
        tags: [Ecosystem]
        summary: Удалить свой push-токен по идентификатору
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '204': { description: Токен удалён }
          '401': { description: Требуется Bearer-токен }
          '404': { description: Токен не найден }

    /api/ecosystem:
      get:
        tags: [Ecosystem]
        summary: Ограниченная персональная сводка экосистемы
        security: [{ bearerAuth: [] }]
        responses:
          '200':
            description: Избранные клубы, счётчики и актуальные highlights
            content:
              application/json:
                schema:
                  type: object
                  required: [favoriteClubs, counts, highlights]
                  properties:
                    favoriteClubs:
                      type: array
                      maxItems: 20
                      items: { type: object }
                    counts:
                      type: object
                      properties:
                        favoriteClubs: { type: integer }
                        unreadNotifications: { type: integer }
                        unreadChats: { type: integer }
                        activeSubscriptions: { type: integer }
                        expiringSubscriptions: { type: integer }
                    highlights:
                      type: object
                      properties:
                        favoriteClubNews:
                          type: array
                          maxItems: 10
                          items: { type: object }
                        expiringSubscriptions:
                          type: array
                          maxItems: 10
                          items: { type: object }
          '401': { description: Требуется Bearer-токен }

    /api/me/ai-matches:
      get:
        tags: [Public]
        summary: История caller-supplied AI match результатов (сервер не генерирует рекомендации)
        security: [{ bearerAuth: [] }]
        parameters:
          - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        responses:
          '200': { description: До 100 собственных записей истории }
          '401': { description: Требуется Bearer-токен }
      post:
        tags: [Public]
        summary: Сохранить request/result JSON, предоставленные вызывающей стороной
        description: Этот endpoint только хранит историю и не запускает AI.
        security: [{ bearerAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [requestJson, resultJson]
                properties:
                  requestJson: { description: JSON до 100 KB }
                  resultJson: { description: JSON до 100 KB }
        responses:
          '201': { description: История сохранена; старые записи сверх 100 удалены }
          '400': { description: Неверный или слишком большой JSON }

    /api/me/ai-matches/{id}:
      delete:
        tags: [Public]
        summary: Удалить собственную запись AI match history
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '204': { description: Удалено }
          '404': { description: Запись не найдена или принадлежит другому пользователю }

    /api/me/support:
      get:
