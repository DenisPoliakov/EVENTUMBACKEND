name: Protect main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  from-sdd-devel:
    name: PR в main только из sdd-devel
    runs-on: ubuntu-latest
    steps:
      - name: Проверить исходную ветку
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "sdd-devel" ]; then
            echo "PR в main разрешён только из ветки sdd-devel (сейчас: ${HEAD_REF:-<пусто>})."
            echo "Агентам запрещено пушить и мёржить в main. В main изменения попадают только через PR из sdd-devel, смёрженный человеком."
            exit 1
          fi
