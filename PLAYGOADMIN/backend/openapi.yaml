          '404': { description: Код не найден }
          '409': { description: Код уже применён, срок применения истёк или владелец заблокирован }

    /api/me/orders:
      post:
        tags: [Public]
        summary: Создать идемпотентный заказ и получить URL подтверждения YooKassa
        description: Цена, валюта и длительность всегда берутся из MembershipPlan. Абонемент создаётся только проверенным webhook.
        security: [{ bearerAuth: [] }]
        parameters:
          - name: Idempotency-Key
            in: header
            required: true
            schema: { type: string, maxLength: 200 }
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: string, format: uuid }
                  passId: { type: string, format: uuid, description: Alias for planId }
                  clubId: { type: string, format: uuid }
                  type: { type: string, enum: [MEMBERSHIP, subscription, pass] }
        responses:
          '201':
            description: Заказ и provider payment созданы
            content:
              application/json:
                schema: { $ref: '#/components/schemas/Order' }
          '200':
            description: Идемпотентный повтор
          '503':
            description: PENDING заказ сохранён; code=PAYMENTS_NOT_CONFIGURED

    /api/subscriptions:
      post:
        tags: [Public]
        deprecated: true
        summary: Отключённый legacy endpoint прямой активации
        responses:
          '410':
            description: Используйте POST /api/me/orders

    /api/webhooks/yookassa:
      post:
        tags: [Public]
        summary: Проверить платёж у YooKassa и идемпотентно активировать абонемент или Premium
        responses:
          '200': { description: Проверено и обработано }
          '400': { description: Платёж не совпадает с заказом }
          '503': { description: YooKassa не настроена }

    /api/admin/orders:
      get:
        tags: [Admin]
        security: [{ basicAuth: [] }]
        summary: Заказы и платежи
        parameters:
          - { name: status, in: query, schema: { type: string } }
          - { name: paymentStatus, in: query, schema: { type: string } }
          - { name: clubId, in: query, schema: { type: string } }
          - { name: userId, in: query, schema: { type: string } }
        responses:
          '200':
            description: Заказы
            content:
              application/json:
                schema:
                  type: array
                  items: { $ref: '#/components/schemas/Order' }

    /api/admin/premium:
      get:
        tags: [Admin]
        security: [{ basicAuth: [] }]
        summary: Read-only список Premium-тарифов и оплаченных подписок
        responses:
          '200': { description: Тарифы и последние 500 подписок }

    /api/admin/bookings/{id}/status:
      patch:
        tags: [Admin]
        summary: Изменить статус бронирования
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
