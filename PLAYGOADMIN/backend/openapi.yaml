                  name: { type: string, maxLength: 200 }
                  title: { type: string, maxLength: 200 }
                  body: { type: string, maxLength: 1000 }
                  imageUrl: { type: string, maxLength: 2000 }
                  data: { type: object }
                  targetSegment: { type: string, enum: [ALL_USERS, SELECTED_USERS, FAVORITE_CLUB] }
                  selectedUserIds: { type: array, maxItems: 2000, items: { type: string } }
                  favoriteClubId: { type: string }
        responses:
          '201': { description: Draft создан }

    /api/admin/push-campaigns/{id}/preview:
