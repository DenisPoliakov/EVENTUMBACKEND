          - { name: priority, in: query, schema: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] } }
        responses:
          '200': { description: До 250 тикетов }

    /api/admin/support/{id}:
      get:
        tags: [Admin]
        summary: Detail тикета, включая internal notes
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '200': { description: Тикет и сообщения }
      patch:
        tags: [Admin]
        summary: Изменить status и/или priority
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '200': { description: Тикет обновлён }

    /api/admin/support/{id}/replies:
      post:
        tags: [Admin]
        summary: Публичный ответ пользователю
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '201': { description: Ответ добавлен; статус WAITING_USER }

    /api/admin/support/{id}/notes:
      post:
        tags: [Admin]
        summary: Внутренняя заметка оператора
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '201': { description: Заметка добавлена и не видна пользователю }

    /api/me/privacy:
      get:
        tags: [Privacy]
        summary: Текущие настройки приватности
        security: [{ bearerAuth: [] }]
        responses:
          '200':
            description: |
              profileVisibility = PUBLIC | FRIENDS | PRIVATE.
              hideEmail / hidePhone / hideBirthDate / hideCity / hideCoachContacts — точечное скрытие.
      patch:
        tags: [Privacy]
        summary: Обновить приватность профиля
        security: [{ bearerAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  profileVisibility: { type: string, enum: [PUBLIC, FRIENDS, PRIVATE] }
                  hideEmail: { type: boolean }
                  hidePhone: { type: boolean }
                  hideBirthDate: { type: boolean }
                  hideCity: { type: boolean }
                  hideCoachContacts: { type: boolean }
        responses:
          '200': { description: privacy + user }

    /api/me/chats:
      get:
        tags: [Chats]
        summary: Список чатов текущего продукта
        description: Без Clubs-чатов в Football и наоборот. Передавайте X-Eventum-Product.
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ProductHeader'
          - { name: product, in: query, schema: { type: string, enum: [FOOTBALL, CLUBS] } }
          - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        responses:
          '200': { description: '{ productCode, chats[] }' }

    /api/me/chats/saved:
      post:
        tags: [Chats]
        summary: Избранное — чат с самим собой
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ProductHeader'
        responses:
          '201': { description: '{ chat } с isSelfChat=true' }

    /api/me/chats/direct:
      post:
        tags: [Chats]
        summary: Создать/открыть личный чат
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ProductHeader'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId: { type: string, format: uuid }
        responses:
          '201': { description: '{ chat }' }

    /api/me/chats/coach-profile/{coachProfileId}:
      post:
        tags: [Chats]
        summary: Чат с тренером (всегда product=CLUBS)
        security: [{ bearerAuth: [] }]
        parameters:
          - name: coachProfileId
            in: path
            required: true
            schema: { type: string, format: uuid }
        responses:
          '201': { description: '{ chat } в CLUBS' }

    /api/me/chats/{chatId}:
      get:
        tags: [Chats]
        summary: Один чат
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
        responses:
          '200': { description: '{ chat }' }
      delete:
        tags: [Chats]
        summary: Скрыть/удалить чат у себя (soft-delete)
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
        responses:
          '204': { description: Чат скрыт для текущего пользователя }

    /api/me/chats/{chatId}/messages:
      get:
        tags: [Chats]
        summary: Сообщения чата
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
          - { name: limit, in: query, schema: { type: integer, default: 50 } }
          - { name: before, in: query, schema: { type: string, format: date-time } }
          - { name: includeDeleted, in: query, schema: { type: boolean, default: false } }
        responses:
          '200': { description: '{ messages[] }' }
      post:
        tags: [Chats]
        summary: Отправить сообщение
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        responses:
          '201': { description: '{ message }' }

    /api/me/chats/{chatId}/messages/{messageId}:
      patch:
        tags: [Chats]
        summary: Редактировать своё сообщение
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
          - $ref: '#/components/parameters/MessageIdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        responses:
          '200': { description: '{ message } с editedAt' }
      delete:
        tags: [Chats]
        summary: Удалить своё сообщение (soft-delete)
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
          - $ref: '#/components/parameters/MessageIdPath'
        responses:
          '200': { description: '{ message } с isDeleted=true' }

    /api/me/chats/{chatId}/read:
      post:
        tags: [Chats]
        summary: Пометить чат прочитанным
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
        responses:
          '200': { description: '{ chat }' }

    /api/me/friends/requests/{friendshipId}:
      delete:
        tags: [Friends]
        summary: Отозвать исходящую заявку (или удалить связь) по friendshipId
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/FriendshipIdPath'
        responses:
          '204': { description: Заявка/дружба удалена }

    /api/me/avatar:
      post:
        tags: [Auth]
        summary: Загрузить аватар профиля
        description: |
          multipart/form-data, поле `file`.
          Сохраняет файл в `/uploads/avatars/...`, пишет путь в `User.avatarUrl`.
          Если есть player-card — синхронизирует и её `avatarUrl`.
          Возвращается в `GET /api/me` и login/register.
        security: [{ bearerAuth: [] }]
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file:
                    type: string
                    format: binary
        responses:
          '201':
            description: '{ url, avatarUrl, user, savedToDatabase }'
      delete:
        tags: [Auth]
        summary: Удалить аватар профиля
        security: [{ bearerAuth: [] }]
        responses:
          '200':
            description: '{ avatarUrl: "", user }'

    /api/me/chats/{chatId}/media:
      post:
        tags: [Chats]
        summary: Отправить медиа (фото/альбом, голос, видео, кружок)
        description: |
          multipart/form-data.
          - `type`: IMAGE | VOICE | VIDEO | VIDEO_NOTE | ALBUM
          - `files` или `file`: до **10** объектов за раз
          - IMAGE = только фото, VIDEO = только видео, ALBUM = микс (напр. 4 фото + 6 видео)
          - сервер сам нормализует тип по mime (микс → ALBUM)
          - `caption`/`text`: опциональная подпись
          - `replyToMessageId`: ответ на сообщение
          - `durationMs`: обязателен для VIDEO_NOTE (макс 60000)
          - `clientPlatform`: desktop/web → VIDEO_NOTE запрещён (403)
          Файлы: `/uploads/chats/{product}/{chatId}/...`.
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
          - $ref: '#/components/parameters/ProductHeader'
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [IMAGE, VOICE, VIDEO, VIDEO_NOTE, ALBUM] }
                  files: { type: array, items: { type: string, format: binary }, maxItems: 10 }
                  file: { type: string, format: binary }
                  caption: { type: string }
                  text: { type: string }
                  replyToMessageId: { type: string, format: uuid }
                  durationMs: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
                  clientPlatform: { type: string, example: ios }
                  thumbnailUrl: { type: string }
        responses:
          '201': { description: '{ message }' }

    /api/me/chats/{chatId}/media/upload:
      post:
        tags: [Chats]
        summary: Только загрузить файлы (синк кеша), без сообщения
        description: Возвращает mediaUrls — потом POST /messages с type + mediaUrls.
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/ChatIdPath'
          - $ref: '#/components/parameters/ProductHeader'
        responses:
          '201': { description: '{ files[], mediaUrls[] }' }

