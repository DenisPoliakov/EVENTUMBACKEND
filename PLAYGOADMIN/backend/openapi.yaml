        description: Без FCM credentials статус SKIPPED и pushSentCount=0; максимум 2000 получателей.
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '202': { description: Попытка завершена и durable counters сохранены }
          '200': { description: Уже отправлено или параллельная попытка дедуплицирована }

    /api/admin/push-campaigns/templates:
      get:
        tags: [Admin]
        summary: Шаблоны ручных push-кампаний
        security: [{ basicAuth: [] }]
        responses:
          '200': { description: До 250 шаблонов }
      post:
        tags: [Admin]
        summary: Создать шаблон
        security: [{ basicAuth: [] }]
        responses:
          '201': { description: Шаблон создан }

    /api/admin/push-campaigns/templates/{id}:
      put:
        tags: [Admin]
        summary: Обновить шаблон
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '200': { description: Шаблон обновлён }
      delete:
        tags: [Admin]
        summary: Удалить шаблон
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '204': { description: Шаблон удалён }

    /api/admin/support:
      get:
        tags: [Admin]
        summary: Очередь support tickets
        security: [{ basicAuth: [] }]
