          '201': { description: Тикет создан }

    /api/me/support/{id}/replies:
      post:
        tags: [Public]
        summary: Ответить в собственный незакрытый тикет
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, maxLength: 10000 }
        responses:
          '201': { description: Ответ добавлен }
          '409': { description: Тикет закрыт }

    /api/admin/workout-analytics:
      get:
        tags: [Admin]
        summary: Ограниченные агрегаты тренировочных сессий
        security: [{ basicAuth: [] }]
        parameters:
          - { name: from, in: query, schema: { type: string, format: date-time } }
          - { name: to, in: query, schema: { type: string, format: date-time } }
          - { name: popularLimit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        responses:
          '200': { description: "Sessions, unique users, duration и popular programs" }
          '400': { description: Неверный или превышающий 366 дней диапазон }

    /api/admin/push-campaigns:
      get:
        tags: [Admin]
        summary: Последние 250 durable push campaigns
        security: [{ basicAuth: [] }]
        responses:
          '200': { description: Кампании и delivery counters }
      post:
        tags: [Admin]
        summary: Создать draft ручной кампании
        security: [{ basicAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [name, title, body, targetSegment]
