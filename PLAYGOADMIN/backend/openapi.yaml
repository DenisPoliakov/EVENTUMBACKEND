    /api/search/places:
      get:
        tags: [Public]
        summary: Поиск клубов из БД и адресов/объектов OpenStreetMap
        description: |
          Возвращает локальные клубы и результаты forward geocoding Nominatim.
          Нельзя использовать публичный Nominatim как autocomplete на каждое
          нажатие клавиши. Клиент обязан показывать OSM attribution из ответа.
        parameters:
          - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
          - { name: city, in: query, schema: { type: string } }
          - { name: cityId, in: query, schema: { type: string }, description: UUID города из БД; приоритетнее city }
          - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
          - { name: externalLimit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
          - { name: countryCodes, in: query, schema: { type: string, default: ru } }
          - { name: language, in: query, schema: { type: string, default: ru } }
          - { name: external, in: query, schema: { type: boolean, default: true } }
        responses:
          '200':
            description: Локальные клубы и OSM-места
            content:
              application/json:
                schema:
                  type: object
                  required: [query, clubs, places, externalStatus, attribution]
                  properties:
                    query: { type: string }
                    clubs:
                      type: array
                      items: { $ref: '#/components/schemas/SportClub' }
                    places:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string, example: 'osm:way:456' }
                          source: { type: string, enum: [OSM_NOMINATIM] }
                          name: { type: string }
                          displayName: { type: string }
                          category: { type: string }
                          type: { type: string }
                          osmType: { type: string }
                          osmId: { type: string }
                          latitude: { type: number, format: double }
                          longitude: { type: number, format: double }
                          boundingBox:
                            type: array
                            items: { type: number }
                          address: { type: object, additionalProperties: true }
                          mapUrl: { type: string, format: uri }
                    externalStatus: { type: string, enum: [OK, UNAVAILABLE, DISABLED] }
                    externalCached: { type: boolean }
                    attribution:
                      type: object
                      properties:
                        text: { type: string }
                        url: { type: string, format: uri }
          '400':
            description: q короче двух символов
          '404':
            description: cityId не найден
          '429':
            description: Превышен лимит поисковых запросов

