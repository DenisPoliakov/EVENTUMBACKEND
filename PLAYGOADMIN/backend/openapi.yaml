  openapi: 3.0.3
  info:
    title: EVENTUM API
    description: |
      REST API для EVENTUM Football / EVENTUM Clubs и админ-панели.

      ## Продукты
      Чаты разделены по продуктам. Передавайте заголовок:
      `X-Eventum-Product: FOOTBALL` или `X-Eventum-Product: CLUBS`
      (альтернатива: query/body `product` / `productCode`).

      - Football не видит Clubs-чаты (например, с тренерами).
      - Чаты с тренерами всегда в `CLUBS`.
      - Избранное (чат с собой): `POST /api/me/chats/saved`.

      ## Авторизация
      - Пользователь: JWT `Bearer` (`accessToken` из login/register).
      - Админка: HTTP Basic (`ADMIN_USER` / `ADMIN_PASSWORD`).

      ## Swagger UI
      Интерактивная документация: `/api/docs`  
      Сырой OpenAPI JSON: `/api/openapi.json`
    version: 0.2.0

  servers:
    - url: http://localhost:4000
      description: Локальный сервер
    - url: http://92.246.76.150:8080
      description: VPS demo

  tags:
    - name: Public
      description: Без авторизации (часть — публичный каталог)
    - name: Auth
      description: Регистрация, вход, профиль (JWT)
    - name: Privacy
      description: Приватность профиля (visibility и скрытие полей)
    - name: Chats
      description: Личные чаты, избранное, сообщения (JWT + X-Eventum-Product)
    - name: Friends
      description: Друзья и заявки (JWT)
    - name: Player cards
      description: Карточки футболистов
    - name: Teams
      description: Команды пользователя (JWT)
    - name: Wellness
      description: Wellness-истории и аналитика просмотров
    - name: Workouts
      description: Программы тренировок, шаги и аналитика просмотров
    - name: Ecosystem
      description: Персональная сводка, уведомления и push-регистрация
    - name: Admin
      description: CRUD для админки (Basic Auth)

  security:
    []

  components:
    parameters:
      IdPath:
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      ProductHeader:
        name: X-Eventum-Product
        in: header
        required: false
        description: FOOTBALL (по умолчанию) или CLUBS — область чатов/друзей
        schema:
          type: string
          enum: [FOOTBALL, CLUBS]
          default: FOOTBALL
      ChatIdPath:
        name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      MessageIdPath:
        name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      FriendshipIdPath:
        name: friendshipId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
        description: Токен из `POST /api/auth/login` или `register` (поле `accessToken`)
      basicAuth:
        type: http
        scheme: basic
        description: Логин и пароль из `ADMIN_USER` и `ADMIN_PASSWORD`

    schemas:
      Error:
        type: object
        properties:
          error:
            type: string
          message:
            type: string
            description: Подробности (на русском при блокировках и бизнес-ошибках)

      HealthResponse:
        type: object
        properties:
          status:
            type: string
            example: ok
          timestamp:
            type: string
            format: date-time

      UserPublic:
        type: object
        properties:
          id: { type: string, format: uuid }
          email: { type: string, format: email }
          username: { type: string }
          firstName: { type: string }
          lastName: { type: string }
          city: { type: string }
          isBlocked: { type: boolean }
          blockReason: { type: string }
          blockedUntil: { type: string, format: date-time, nullable: true }
          matchBanUntil: { type: string, format: date-time, nullable: true }
          hasPlayerCard: { type: boolean }

      AuthResponse:
        type: object
        required: [accessToken, refreshToken, expiresIn, user]
        properties:
          accessToken:
            type: string
            description: JWT
          user:
            $ref: '#/components/schemas/UserPublic'
          refreshToken:
            type: string
            description: Одноразовый opaque refresh token
          expiresIn:
            type: integer
            description: Срок access token в секундах
          referralBonus:
            nullable: true
            type: object
            properties:
              applied: { type: boolean }
              premiumDays: { type: integer }
              expiresAt: { type: string, format: date-time, nullable: true }

      RefreshTokenRequest:
        type: object
        required: [refreshToken]
        properties:
          refreshToken: { type: string }

      RegisterRequest:
        type: object
        required: [email, username, password, city]
        properties:
          email:
            type: string
            format: email
          username:
            type: string
          password:
            type: string
            minLength: 6
          firstName: { type: string }
          lastName: { type: string }
          city:
            type: string
            description: Название города; при отсутствии в БД будет создан
          referralCode:
            type: string
            description: Необязательный код приглашения; неверный код отменяет регистрацию
          inviteCode:
            type: string
            description: Alias for referralCode

      PremiumCredits:
        type: object
        required: [balanceCents, earnedCents, spentCents, currency]
        properties:
          balanceCents: { type: integer, minimum: 0 }
          earnedCents: { type: integer, minimum: 0 }
          spentCents: { type: integer, minimum: 0 }
          currency: { type: string, example: RUB }
          canPurchase: { type: boolean }

      PremiumCreditTransaction:
        type: object
        required: [id, type, amountCents, balanceAfterCents, currency, createdAt]
        properties:
          id: { type: string, format: uuid }
          type:
            type: string
            enum: [REFERRAL_REWARD, PREMIUM_PURCHASE, ADMIN_ADJUSTMENT, REVERSAL]
          amountCents:
            type: integer
            description: Положительное начисление или отрицательное списание
          balanceAfterCents: { type: integer, minimum: 0 }
          currency: { type: string }
          referralRedemptionId: { type: string }
          orderId: { type: string }
          metadata: { type: object, additionalProperties: true }
          createdAt: { type: string, format: date-time }

      LoginRequest:
        type: object
        required: [identifier, password]
        properties:
          identifier:
            type: string
            description: Email или username
          password: { type: string }

      PatchMeRequest:
        type: object
        required: [email, city]
        properties:
          email: { type: string, format: email }
          firstName: { type: string }
          lastName: { type: string }
          city: { type: string }

      PasswordCheckRequest:
        type: object
        required: [password]
        properties:
          password: { type: string }

      PasswordChangeRequest:
        type: object
        required: [oldPassword, newPassword]
        properties:
          oldPassword: { type: string }
          newPassword: { type: string, minLength: 6 }

      PlayerCardUser:
        type: object
        properties:
          id: { type: string }
          email: { type: string }
          username: { type: string }
          firstName: { type: string }
          lastName: { type: string }

      TeamSummaryLite:
        type: object
        nullable: true
        properties:
          id: { type: string }
          name: { type: string }
          city: { type: string }
          captain:
            type: object
            properties:
              id: { type: string }
              username: { type: string }
              firstName: { type: string }
              lastName: { type: string }
          memberCount: { type: integer }

      PlayerCard:
        type: object
        properties:
          id: { type: string, format: uuid }
          userId: { type: string, format: uuid }
          position:
            type: string
            enum: [GK, DF, MF, FW]
          preferredFoot:
            type: string
            enum: [LEFT, RIGHT, BOTH]
          heightCm: { type: integer, nullable: true }
          weightKg: { type: integer, nullable: true }
          age: { type: integer, nullable: true }
          favoriteFormat:
            type: string
            enum: [FIVE_X_FIVE, SEVEN_X_SEVEN, ELEVEN_X_ELEVEN]
          bio: { type: string }
          avatarUrl:
            type: string
            description: Относительный путь к файлу; к URL добавьте базовый адрес API.
          skillTags:
            type: array
            items:
              type: string
              enum: [PACE, SHOOTING, PASSING, DRIBBLING, STAMINA, DEFENDING]
          statuses:
            type: array
            items:
              type: string
              enum:
                - LOOKING_FOR_TEAM
                - READY_TO_PLAY
                - CAPTAIN
                - WITHOUT_TEAM
          rating: { type: integer, minimum: 40, maximum: 99 }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
          city: { type: string }
          user:
            $ref: '#/components/schemas/PlayerCardUser'
          currentTeam:
            $ref: '#/components/schemas/TeamSummaryLite'

      PlayerCardOptions:
        type: object
        properties:
          positions:
            type: array
            items: { type: string }
          preferredFeet:
            type: array
            items: { type: string }
          formats:
            type: array
            items: { type: string }
          skillTags:
            type: array
            items: { type: string }
          statuses:
            type: array
            items: { type: string }

      PlayerCardUpsertRequest:
        type: object
        required: [position, preferredFoot, favoriteFormat, skillTags, statuses]
        properties:
          position: { type: string, enum: [GK, DF, MF, FW] }
          preferredFoot: { type: string, enum: [LEFT, RIGHT, BOTH] }
          favoriteFormat:
            type: string
            enum: [FIVE_X_FIVE, SEVEN_X_SEVEN, ELEVEN_X_ELEVEN]
          skillTags:
            type: array
            minItems: 1
            maxItems: 3
            items: { type: string }
          statuses:
            type: array
            minItems: 1
            maxItems: 3
            items: { type: string }
          heightCm: { type: integer }
          weightKg: { type: integer }
          age: { type: integer }
          bio: { type: string }
          avatarUrl: { type: string }
          rating: { type: integer, description: 40–99, по умолчанию 70 }
          city: { type: string, description: Опционально — привязка карточки к городу }

      MePlayerCardResponse:
        type: object
        properties:
          playerCard:
            $ref: '#/components/schemas/PlayerCard'
            nullable: true

      AvatarUploadResponse:
        type: object
        properties:
          url: { type: string, example: /uploads/players/1234567890-abc.jpg }
          savedToDatabase: { type: boolean }
          playerCard:
            $ref: '#/components/schemas/PlayerCard'
            nullable: true

      TeamUser:
        type: object
        properties:
          id: { type: string }
          username: { type: string }
          firstName: { type: string }
          lastName: { type: string }
          email: { type: string }

      TeamMemberSerialized:
        type: object
        properties:
          id: { type: string }
          userId: { type: string }
          role:
            type: string
            enum: [CAPTAIN, MEMBER, SUBSTITUTE]
          fieldPosition:
            type: string
            enum: ['', GK, DF, MF, FW]
          user:
            $ref: '#/components/schemas/TeamUser'

      TeamInvitationSerialized:
        type: object
        properties:
          id: { type: string }
          status: { type: string }
          inviteeIdentifier: { type: string }
          createdAt: { type: string, format: date-time }
          invitee:
            $ref: '#/components/schemas/TeamUser'

      TeamSerialized:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          cityId: { type: string }
          city: { type: string }
          captainUserId: { type: string }
          captain:
            $ref: '#/components/schemas/TeamUser'
          members:
            type: array
            items:
              $ref: '#/components/schemas/TeamMemberSerialized'
          invitations:
            type: array
            items:
              $ref: '#/components/schemas/TeamInvitationSerialized'

      CreateTeamRequest:
        type: object
        required: [name]
        properties:
          name: { type: string }

      InviteToTeamRequest:
        type: object
        required: [teamId, identifier]
        properties:
          teamId: { type: string, format: uuid }
          identifier:
            type: string
            description: email или username в нижнем регистре

      TeamMemberPatchRequest:
        type: object
        required: [role]
        properties:
          role:
            type: string
            enum: [MEMBER, SUBSTITUTE]
          fieldPosition:
            type: string
            enum: [GK, DF, MF, FW]
            description: Пустая строка сбрасывает позицию

      City:
        type: object
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      Stadium:
        type: object
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          address: { type: string }
          description: { type: string, nullable: true }
          latitude: { type: string, description: Decimal как string в JSON }
          longitude: { type: string }
          imageUrl: { type: string, nullable: true }
          cityId: { type: string }
          city:
            $ref: '#/components/schemas/City'
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      Match:
        type: object
        properties:
          id: { type: string, format: uuid }
          stadiumId: { type: string }
          startTime: { type: string, format: date-time }
          endTime: { type: string, format: date-time }
          format:
            type: string
            enum: [FIVE_X_FIVE, SEVEN_X_SEVEN, ELEVEN_X_ELEVEN]
          maxTeams: { type: integer }
          priceCents: { type: integer, nullable: true }
          currency: { type: string, nullable: true }
          status:
            type: string
            enum: [DRAFT, OPEN, FULL, FINISHED, CANCELLED]
          approvalMode:
            type: string
            enum: [MANUAL, AUTO_FIRST_COME]
          description: { type: string, nullable: true }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
          stadium:
            allOf:
              - $ref: '#/components/schemas/Stadium'
            description: При include из Prisma

      MatchRegistration:
        type: object
        properties:
          id: { type: string, format: uuid }
          matchId: { type: string }
          teamId: { type: string, nullable: true }
          teamName: { type: string }
          captainName: { type: string }
          captainLogin: { type: string }
          cityId: { type: string }
          stadiumId: { type: string }
          playersCount: { type: integer, nullable: true }
          status:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
          note: { type: string, nullable: true }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      PublicRegistrationRequest:
        type: object
        required: [matchId, teamName, captainName, captainLogin]
        properties:
          matchId: { type: string, format: uuid }
          teamName: { type: string, description: Для логики приложения подставляется команда пользователя }
          captainName: { type: string }
          captainLogin: { type: string, description: Email или username капитана }
          note: { type: string }
          playersCount: { type: integer }

      PublicRegistrationResponse:
        allOf:
          - $ref: '#/components/schemas/MatchRegistration'
        properties:
          autoApproved: { type: boolean }
          teamId: { type: string }

      News:
        type: object
        required:
          - id
          - title
          - body
          - type
          - publishedAt
          - viewCount
          - uniqueViewerCount
        properties:
          id: { type: string, format: uuid }
          title: { type: string }
          body: { type: string }
          imageUrl: { type: string, nullable: true }
          type:
            type: string
            enum: [news, sponsored, STADIUM_CREATED, MATCH_CREATED]
          clubId: { type: string, nullable: true }
          stadiumId: { type: string, nullable: true }
          matchId: { type: string, nullable: true }
          publishedAt: { type: string, format: date-time }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
          viewCount: { type: integer, minimum: 0 }
          uniqueViewerCount: { type: integer, minimum: 0 }
          isFavoriteClubNews: { type: boolean }

      NewsWrite:
        type: object
        required: [title, body, type]
        properties:
          title: { type: string, maxLength: 300 }
          body: { type: string, maxLength: 20000 }
          imageUrl: { type: string, nullable: true, maxLength: 2000 }
          type: { type: string, enum: [news, sponsored] }
          clubId: { type: string, nullable: true }
          publishedAt: { type: string, format: date-time }

      NewsViewResult:
        type: object
        required: [newsId, viewCount, uniqueViewerCount, isFirstViewByUser]
        properties:
          newsId: { type: string, format: uuid }
          viewCount: { type: integer, minimum: 1 }
          uniqueViewerCount: { type: integer, minimum: 1 }
          isFirstViewByUser: { type: boolean }

      WellnessStory:
        type: object
        required:
          - id
          - title
          - body
          - category
          - readMinutes
          - sortOrder
          - locale
          - publishedAt
          - uniqueViewerCount
          - viewedByMe
        properties:
          id: { type: string, format: uuid }
          slug:
            type: string
            nullable: true
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          title: { type: string }
          body: { type: string }
          category:
            type: string
            enum: [nutrition, warmup, routine, workouts, balance]
          coverImageUrl:
            type: string
            nullable: true
            example: /uploads/wellness-stories/cover.webp
          readMinutes: { type: integer, minimum: 1, maximum: 120 }
          sortOrder: { type: integer }
          locale: { type: string, enum: [ru] }
          publishedAt: { type: string, format: date-time }
          uniqueViewerCount: { type: integer, minimum: 0 }
          viewedByMe: { type: boolean }

      AdminWellnessStory:
        allOf:
          - $ref: '#/components/schemas/WellnessStory'
          - type: object
            required: [isActive, createdAt, updatedAt]
            properties:
              isActive: { type: boolean }
              deletedAt:
                type: string
                format: date-time
                nullable: true
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }

      WellnessStoryWrite:
        type: object
        required: [title, body, category, readMinutes, sortOrder, isActive]
        properties:
          slug:
            type: string
            nullable: true
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            maxLength: 120
          title: { type: string }
          body: { type: string }
          category:
            type: string
            enum: [nutrition, warmup, routine, workouts, balance]
          coverImageUrl: { type: string, nullable: true }
          readMinutes: { type: integer, minimum: 1, maximum: 120 }
          sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
          locale: { type: string, enum: [ru], default: ru }
          publishedAt: { type: string, format: date-time }
          isActive: { type: boolean }

      WellnessStoryViewResult:
        type: object
        required:
          - storyId
          - uniqueViewerCount
          - isFirstViewByUser
        properties:
          storyId: { type: string, format: uuid }
          uniqueViewerCount: { type: integer, minimum: 0 }
          isFirstViewByUser: { type: boolean }

      WellnessStoryImport:
        type: object
        required: [stories]
        properties:
          stories:
            type: array
            minItems: 1
            maxItems: 500
            items:
              allOf:
                - $ref: '#/components/schemas/WellnessStoryWrite'
                - type: object
                  required: [slug]

      WellnessStoryImportResult:
        type: object
        required: [created, updated, stories]
        properties:
          created: { type: integer, minimum: 0 }
          updated: { type: integer, minimum: 0 }
          stories:
            type: array
            items:
              $ref: '#/components/schemas/AdminWellnessStory'

      WorkoutStep:
        type: object
        required: [id, programId, order, phase, title, durationSeconds]
        properties:
          id: { type: string, format: uuid }
          programId:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          order: { type: integer, minimum: 1 }
          phase:
            type: string
            enum: [warmup, work, rest, cooldown]
          title: { type: string }
          description: { type: string, nullable: true }
          durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
          illustrationUrl:
            type: string
            nullable: true
            example: /uploads/workouts/stable-slug/step.webp
          poseIndex: { type: integer, minimum: 0, maximum: 5, nullable: true }

      WorkoutProgram:
        type: object
        required:
          - id
          - title
          - description
          - sortOrder
          - locale
          - stepCount
          - totalDurationSeconds
          - uniqueViewerCount
          - viewedByMe
        properties:
          id:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          title: { type: string }
          subtitle: { type: string, nullable: true }
          description: { type: string }
          guide: { type: string, nullable: true }
          iconKey: { type: string, nullable: true }
          gradientStart:
            type: string
            nullable: true
            pattern: '^#[0-9A-Fa-f]{6}$'
          gradientEnd:
            type: string
            nullable: true
            pattern: '^#[0-9A-Fa-f]{6}$'
          estimatedMinutes: { type: integer, minimum: 1, nullable: true }
          sortOrder: { type: integer }
          locale: { type: string, enum: [ru] }
          stepCount: { type: integer, minimum: 0 }
          totalDurationSeconds: { type: integer, minimum: 0 }
          uniqueViewerCount: { type: integer, minimum: 0 }
          viewedByMe: { type: boolean }

      AdminWorkoutProgram:
        allOf:
          - $ref: '#/components/schemas/WorkoutProgram'
          - type: object
            required: [isActive, createdAt, updatedAt]
            properties:
              isActive: { type: boolean }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
              steps:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutStep'

      WorkoutProgramWrite:
        type: object
        properties:
          id:
            type: string
            maxLength: 120
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          title: { type: string, maxLength: 200 }
          subtitle: { type: string, nullable: true, maxLength: 300 }
          description: { type: string, maxLength: 2000 }
          guide: { type: string, nullable: true, maxLength: 20000 }
          iconKey: { type: string, nullable: true, maxLength: 200 }
          gradientStart: { type: string, nullable: true, pattern: '^#[0-9A-Fa-f]{6}$' }
          gradientEnd: { type: string, nullable: true, pattern: '^#[0-9A-Fa-f]{6}$' }
          estimatedMinutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
          sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
          isActive: { type: boolean }
          locale: { type: string, enum: [ru], default: ru }

      WorkoutStepWrite:
        type: object
        properties:
          order: { type: integer, minimum: 1, maximum: 10000 }
          phase:
            type: string
            enum: [warmup, work, rest, cooldown]
          title: { type: string, maxLength: 200 }
          description: { type: string, nullable: true, maxLength: 2000 }
          durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
          illustrationUrl: { type: string, nullable: true }
          poseIndex: { type: integer, minimum: 0, maximum: 5, nullable: true }

      WorkoutProgramViewResult:
        type: object
        required: [programId, uniqueViewerCount, isFirstViewByUser]
        properties:
          programId: { type: string }
          uniqueViewerCount: { type: integer, minimum: 0 }
          isFirstViewByUser: { type: boolean }

      WorkoutSession:
        type: object
        required:
          - id
          - programId
          - finishedAt
          - durationSeconds
          - source
          - createdAt
          - updatedAt
        properties:
          id: { type: string, format: uuid }
          programId: { type: string }
          startedAt: { type: string, format: date-time, nullable: true }
          finishedAt: { type: string, format: date-time }
          durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
          source: { type: string, enum: [timer, manual, imported] }
          customPlan: { type: object, nullable: true, additionalProperties: true }
          clientKey: { type: string, nullable: true, maxLength: 200 }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      WorkoutSessionWrite:
        type: object
        required: [programId, finishedAt, durationSeconds, source]
        properties:
          programId: { type: string, maxLength: 120 }
          startedAt: { type: string, format: date-time, nullable: true }
          finishedAt: { type: string, format: date-time }
          durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
          source: { type: string, enum: [timer, manual, imported] }
          customPlan: { type: object, nullable: true, additionalProperties: true }
          clientKey: { type: string, nullable: true, maxLength: 200 }

      ClubSchedule:
        type: object
        required: [id, startTime, endTime, priceCents]
        properties:
          id: { type: string, format: uuid }
          title: { type: string }
          dayOfWeek: { type: integer, minimum: 1, maximum: 7, nullable: true }
          startTime: { type: string, example: '18:00' }
          endTime: { type: string, example: '19:30' }
          coachName: { type: string }
          coachProfileId: { type: string }
          coachId: { type: string, description: Alias for coachProfileId }
          priceCents: { type: integer, minimum: 0 }

      MembershipPlan:
        type: object
        required: [id, sportId, title, priceCents, currency, durationDays, isActive]
        properties:
          id: { type: string, format: uuid }
          sportId: { type: string, format: uuid }
          clubId: { type: string, format: uuid, nullable: true }
          tier: { type: string, enum: [BRONZE, SILVER, GOLD], nullable: true }
          title: { type: string }
          description: { type: string }
          priceCents: { type: integer, minimum: 0 }
          currency: { type: string, example: RUB }
          durationDays: { type: integer, minimum: 1 }
          isActive: { type: boolean }

      SportClub:
        type: object
        required: [id, sportId, name, address, tier, schedules, passes]
        properties:
          id: { type: string, format: uuid }
          sportId: { type: string, format: uuid }
          name: { type: string }
          address: { type: string }
          tier: { type: string, enum: [BRONZE, SILVER, GOLD] }
          imageUrl: { type: string, example: /uploads/clubs/cover.webp }
          logoUrl: { type: string, example: /uploads/clubs/logo.webp }
          galleryUrls:
            type: array
            items: { type: string }
          imageUrls:
            type: array
            description: Alias for galleryUrls
            items: { type: string }
          schedules:
            type: array
            items: { $ref: '#/components/schemas/ClubSchedule' }
          passes:
            type: array
            description: Active membership plans only
            items: { $ref: '#/components/schemas/MembershipPlan' }

      TrainingBookingWrite:
        type: object
        required: [scheduledAt]
        properties:
          scheduleEntryId: { type: string, format: uuid }
          scheduleId: { type: string, format: uuid, description: Alias for scheduleEntryId }
          clubId: { type: string, format: uuid }
          coachProfileId: { type: string, format: uuid }
          coachId: { type: string, description: Coach profile or coach user ID }
          scheduledAt: { type: string, format: date-time }
          scheduleTitle: { type: string, description: Ignored when the schedule has a title }
          note: { type: string }
          priceCents:
            type: integer
            description: Optional compatibility field; rejected if it differs from the server schedule price

      TrainingBooking:
        type: object
        required:
          - id
          - userId
          - clubId
          - scheduledAt
          - scheduleTitle
          - priceCents
          - platformFeeCents
          - currency
          - status
        properties:
          id: { type: string, format: uuid }
          userId: { type: string, format: uuid }
          clubId: { type: string, format: uuid }
          clubName: { type: string }
          scheduleEntryId: { type: string }
          scheduleId: { type: string, description: Alias for scheduleEntryId }
          coachProfileId: { type: string }
          coachId: { type: string, description: Alias for coachProfileId }
          scheduledAt: { type: string, format: date-time }
          scheduleTitle: { type: string }
          note: { type: string }
          priceCents: { type: integer, minimum: 0 }
          platformFeeCents: { type: integer, minimum: 0, description: 15% of priceCents }
          currency: { type: string, example: RUB }
          status:
            type: string
            enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      Payment:
        type: object
        properties:
          id: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          provider: { type: string, enum: [YOOKASSA] }
          externalId: { type: string }
          status: { type: string, enum: [PENDING, SUCCEEDED, CANCELLED, FAILED] }
          amountCents: { type: integer }
          currency: { type: string }
          confirmationUrl: { type: string }

      Order:
        type: object
        required: [id, userId, type, status, amountCents, currency, durationDays]
        properties:
          id: { type: string, format: uuid }
          userId: { type: string, format: uuid }
          planId: { type: string, format: uuid, nullable: true }
          passId: { type: string, format: uuid, description: Alias for planId }
          premiumPlanId: { type: string, format: uuid }
          clubId: { type: string, format: uuid }
          type: { type: string, enum: [MEMBERSHIP, PREMIUM] }
          status: { type: string, enum: [PENDING, PAYMENT_CREATED, PAID, CANCELLED, FAILED] }
          amountCents: { type: integer }
          currency: { type: string }
          durationDays: { type: integer }
          confirmationUrl: { type: string }
          payment:
            allOf:
              - $ref: '#/components/schemas/Payment'
            nullable: true

      PushToken:
        type: object
        required: [id, platform, lastSeenAt]
        properties:
          id: { type: string, format: uuid }
          platform: { type: string, enum: [IOS, ANDROID, WEB] }
          deviceId: { type: string }
          deviceName: { type: string }
          appVersion: { type: string }
          locale: { type: string }
          lastSeenAt: { type: string, format: date-time }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }

      PushTokenWrite:
        type: object
        required: [token, platform]
        properties:
          token: { type: string, minLength: 20, maxLength: 4096 }
          platform: { type: string, enum: [IOS, ANDROID, WEB] }
          deviceId: { type: string, maxLength: 255 }
          deviceName: { type: string, maxLength: 255 }
          appVersion: { type: string, maxLength: 100 }
          locale: { type: string, maxLength: 35 }

      OkTrue:
        type: object
        properties:
          ok: { type: boolean, example: true }

  paths:
    /api/health:
      get:
        tags: [Public]
        summary: Проверка доступности API
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/HealthResponse'

    /api/news:
      get:
        tags: [Public]
        summary: Публичная лента новостей
        parameters:
          - name: clubId
            in: query
            schema: { type: string }
          - name: type
            in: query
            schema:
              type: string
              enum: [news, sponsored, STADIUM_CREATED, MATCH_CREATED]
          - name: limit
            in: query
            schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
        responses:
          '200':
            description: Новости с точной аналитикой просмотров
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/News'

    /api/me/news/{id}/view:
      post:
        tags: [Public]
        summary: Зафиксировать просмотр новости
        security: [{ bearerAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '200':
            description: Каждый вызов увеличивает viewCount; первый для пользователя увеличивает uniqueViewerCount
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NewsViewResult'
          '401':
            description: Требуется Bearer-токен
          '404':
            description: Новость не найдена

    /api/admin/news:
      get:
        tags: [Admin]
        summary: Новости CMS с аналитикой
        security: [{ basicAuth: [] }]
        responses:
          '200':
            description: Новости
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/News'
      post:
        tags: [Admin]
        summary: Создать обычную или спонсорскую новость
        security: [{ basicAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsWrite'
        responses:
          '201':
            description: Новость создана
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/News'

    /api/admin/news/{id}:
      put:
        tags: [Admin]
        summary: Обновить новость
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsWrite'
        responses:
          '200':
            description: Новость обновлена
      delete:
        tags: [Admin]
        summary: Удалить новость и её аналитику
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '204':
            description: Новость удалена

    /api/admin/news/{id}/image:
      post:
        tags: [Admin]
        summary: Безопасно загрузить изображение новости
        security: [{ basicAuth: [] }]
        parameters:
          - $ref: '#/components/parameters/IdPath'
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file: { type: string, format: binary }
        responses:
          '201':
            description: Изображение сохранено и привязано
          '400':
            description: Неверный тип или размер больше 5 MB

    /api/stadiums:
      get:
        tags: [Public]
        summary: Список стадионов (публичный)
        parameters:
          - name: cityId
            in: query
            schema: { type: string, format: uuid }
          - name: city
            in: query
            schema: { type: string }
            description: Название города без учёта регистра
        responses:
          '200':
            description: Массив стадионов с вложенным `city`
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Stadium'

    /api/matches:
      get:
        tags: [Public]
        summary: Список матчей
        parameters:
          - name: cityId
            in: query
            schema: { type: string }
          - name: stadiumId
            in: query
            schema: { type: string }
          - name: status
            in: query
            schema:
              type: string
              enum: [DRAFT, OPEN, FULL, FINISHED, CANCELLED]
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Match'

    /api/matches/{id}:
      get:
        tags: [Public]
        summary: Матч по id
        parameters:
          - $ref: '#/components/parameters/IdPath'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Match'
          '404':
            description: Match not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/registrations:
      get:
        tags: [Public]
        summary: Список заявок (публичный фильтр)
        parameters:
          - name: matchId
            in: query
            schema: { type: string }
          - name: status
            in: query
            schema: { type: string }
          - name: captainLogin
            in: query
            schema: { type: string }
          - name: teamId
            in: query
            schema: { type: string }
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/MatchRegistration'
      post:
        tags: [Public]
        summary: Подача заявки из приложения
        description: |
          Требует у капитана: карточку футболиста, команду, отсутствие блокировок.
          Поля команды подставляются с сервера из текущей команды пользователя.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegistrationRequest'
        responses:
          '201':
            description: Создана заявка
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PublicRegistrationResponse'
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '403':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '404':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '409':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/player-card-options:
      get:
        tags: [Player cards]
        summary: Справочники для карточки
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlayerCardOptions'

    /api/players:
      get:
        tags: [Player cards]
        summary: Поиск карточек игроков
        parameters:
          - name: cityId
            in: query
            schema: { type: string }
          - name: city
            in: query
            schema: { type: string }
          - name: position
            in: query
            schema: { type: string, enum: [GK, DF, MF, FW] }
          - name: skill
            in: query
            schema: { type: string }
          - name: minRating
            in: query
            schema: { type: integer }
          - name: maxRating
            in: query
            schema: { type: integer }
          - name: lookingForTeam
            in: query
            schema: { type: boolean }
          - name: q
            in: query
            schema: { type: string }
            description: Поиск по username, имени, фамилии, bio
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlayerCard'

    /api/players/{userId}:
      get:
        tags: [Player cards]
        summary: Карточка по user id
        parameters:
          - name: userId
            in: path
            required: true
            schema: { type: string, format: uuid }
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlayerCard'
          '404':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/player-card:
      get:
        tags: [Player cards]
        security: [{ bearerAuth: [] }]
        summary: Моя карточка (или null)
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/MePlayerCardResponse'
          '401':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
      put:
        tags: [Player cards]
        security: [{ bearerAuth: [] }]
        summary: Создать / обновить карточку
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCardUpsertRequest'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/MePlayerCardResponse'
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/player-card/avatar:
      post:
        tags: [Player cards]
        security: [{ bearerAuth: [] }]
        summary: Загрузка аватара (multipart)
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file:
                    type: string
                    format: binary
        responses:
          '201':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AvatarUploadResponse'

    /api/auth/register:
      post:
        tags: [Auth]
        summary: Регистрация
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRequest'
        responses:
          '201':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/auth/login:
      post:
        tags: [Auth]
        summary: Вход
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRequest'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '401':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '403':
            description: Аккаунт заблокирован
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/auth/refresh:
      post:
        tags: [Auth]
        summary: Одноразово ротировать refresh token
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
        responses:
          '200':
            content:
              application/json:
                schema: { $ref: '#/components/schemas/AuthResponse' }
          '401':
            description: Токен недействителен, истёк, уже использован или пользователь недоступен

    /api/auth/logout:
      post:
        tags: [Auth]
        summary: Отозвать refresh token
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
        responses:
          '204':
            description: Токен отозван или уже отсутствует

    /api/me:
      get:
        tags: [Auth]
        security: [{ bearerAuth: [] }]
        summary: Текущий пользователь
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/UserPublic'
          '401':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '403':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
      patch:
        tags: [Auth]
        security: [{ bearerAuth: [] }]
        summary: Обновить профиль
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchMeRequest'
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/UserPublic'

    /api/me/password/check:
      post:
        tags: [Auth]
        security: [{ bearerAuth: [] }]
        summary: Проверка текущего пароля
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordCheckRequest'
        responses:
          '204':
            description: Пароль верный
          '401':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/password:
      post:
        tags: [Auth]
        security: [{ bearerAuth: [] }]
        summary: Смена пароля
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeRequest'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OkTrue'
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '401':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/team:
      get:
        tags: [Teams]
        security: [{ bearerAuth: [] }]
        summary: Моя текущая команда
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    team:
                      allOf:
                        - $ref: '#/components/schemas/TeamSerialized'
                      nullable: true
      post:
        tags: [Teams]
        security: [{ bearerAuth: [] }]
        summary: Создать команду
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamRequest'
        responses:
          '201':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    team:
                      $ref: '#/components/schemas/TeamSerialized'
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '409':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/team/invitations:
      post:
        tags: [Teams]
        security: [{ bearerAuth: [] }]
        summary: Пригласить в команду (только капитан)
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteToTeamRequest'
        responses:
          '201':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    invitation:
                      type: object
          '400':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '403':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '404':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '409':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

    /api/me/team-invitations:
      get:
        tags: [Teams]
        security: [{ bearerAuth: [] }]
        summary: Входящие приглашения
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    invitations:
                      type: array
                      items:
                        type: object

    /api/me/team-invitations/{id}/accept:
      post:
        tags: [Teams]
        security: [{ bearerAuth: [] }]
        summary: Принять приглашение
        parameters:
          - name: id
            in: path
            required: true
            schema: { type: string }
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    team:
                      $ref: '#/components/schemas/TeamSerialized'
          '404':
            content:
              application/json:
                schema:
